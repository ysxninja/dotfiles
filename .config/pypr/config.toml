[pyprland]
plugins = ["scratchpads"]

[scratchpads.term]
command = "alacritty --class scratchpadttrm -e $HOME/.local/bin/tattach-ttrm"
margin = 50
size = "55% 65%"
position = "360px 175px"
animation = ""
multi = false

[scratchpads.lfub]
command = "kitty --class scratchpad -e /usr/bin/lf --config $HOME/.config/lf/lfrc_kitty"
margin = 50
size = "55% 65%"
position = "360px 175px"
animation = ""
multi = false

[scratchpads.music]
command = "kitty --class scratchpadmusic -e ncmpcpp"
margin = 50
size = "50% 40%"
position = "25% 4%"
unfocus = "hide"
animation = ""
multi = false

[scratchpads.btm]
command = "kitty --class scratchpad -e btm"
margin = 50
size = "55% 65%"
position = "360px 175px"
animation = ""
multi = false
