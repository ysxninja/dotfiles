[pyprland]
plugins = ["scratchpads", "expose", "lost_windows"]

[scratchpads.term]
command = "alacritty --class scratchpadttrm -e $HOME/.local/bin/tattach-ttrm"
margin = 50
multi = false

[scratchpads.lfub]
command = "kitty --class scratchpad -e $HOME/.local/bin/lfub"
margin = 50
multi = false

[scratchpads.music]
command = "kitty --class scratchpadmusic -e ncmpcpp"
margin = 50
unfocus = "hide"
animation = "fromTop"
multi = false

[scratchpads.btm]
command = "kitty --class scratchpad -e btm"
margin = 50
multi = false

[scratchpads.pavucontrol]
command = "pavucontrol"
margin = 50
unfocus = "hide"
animation = "fromTop"
multi = false
