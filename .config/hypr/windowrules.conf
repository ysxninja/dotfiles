### Layer rules
layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0
  match:namespace = waybar
}

layerrule {
  name = layerrule-2
  blur = on
  ignore_alpha = 0
  match:namespace = swaync
}

layerrule {
  name = layerrule-3
  no_anim = on
  match:namespace = notifications
}

layerrule {
  name = layerrule-4
  blur = on
  match:namespace = rofi
}
