### Pyprland scratchpad window rules
# Default Scratchpad
windowrule {
  name = windowrule-1
  float = on
  workspace = silent
  match:class = ^(scratchpad)$
}

# Terminal scratchpad
windowrule {
  name = windowrule-3
  float = on
  workspace = silent
  match:class = ^(scratchpadttrm)$
}

# Music scratchpad
windowrule {
  name = windowrule-4
  float = on
  workspace = silent
  match:class = ^(scratchpadmusic)$
}

# windowrulev2 = bordercolor rgba(d9e0eeee) rgba(f9e2afee) 45deg,$musicscratchpad

# windowrulev2 = opacity 0.85,$termscratchpad
windowrule {
  name = windowrule-5
  opacity = 0.90
  match:title = ^(New Tab - Brave)$
}

windowrule {
  name = windowrule-6
  opacity = 0.90
  match:title = ^(Mozilla Firefox)$
}

windowrule {
  name = windowrule-7
  opacity = 0.9
  match:class = ^(org.keepassxc.KeePassXC)$
}

windowrule {
  name = windowrule-8
  opacity = 0.85
  match:class = ^(thunar)$
}

windowrule {
  name = windowrule-9
  fullscreen = on
  match:class = ^(Alacritty)$
}

# $dunst = ^(Dunst)$
# windowrulev2 = animation fade,$dunst
# windowrulev2 = nomaximizerequest, class:.* # You'll probably like this.

### Open applications on specific workspaces
windowrule {
  name = windowrule-10
  workspace = 2
  fullscreen = on
  match:class = (mpv)
}

windowrule {
  name = windowrule-11
  workspace = 2
  fullscreen = on
  match:class = (io.github.celluloid_player.Celluloid)
}

windowrule {
  name = windowrule-12
  workspace = 3
  match:class = (google-chrome)
}

windowrule {
  name = windowrule-13
  workspace = 2
  match:class = (burp-StartBurp)
}

### Fullscreen for assigned workspace apps

### Open specific apps in specific modes
windowrule {
  name = windowrule-14
  float = on
  center = on
  size = (monitor_w*0.8) (monitor_h*0.8)
  match:class = (burp-StartBurp)
  match:title = (Settings)
}

windowrule {
  name = windowrule-15
  float = on
  match:title = ^(File Transfer)(.*)$
}

windowrule {
  name = windowrule-16
  float = on
  match:class = (iwgtk)
}

windowrule {
  name = windowrule-17
  float = on
  match:class = (xdm-app)
}

windowrule {
  name = windowrule-18
  float = on
  match:class = (org.twosheds.iwgtk)
}

windowrule {
  name = windowrule-19
  float = on
  match:class = (org.kde.kdeconnect.handler)
}

windowrule {
  name = windowrule-20
  float = on
  match:class = (org.kde.kdeconnect.daemon)
}

# Thunderbird
windowrule {
  name = windowrule-21
  float = on
  match:class = ^(thunderbird)$
  match:initial_title = ^(\s*)$
}

windowrule {
  name = windowrule-22
  opacity = 0.80 0.70
  float = on
  size = 700 400
  match:class = ^(thunderbird)$
  match:initial_title = ^(Calendar Reminders)$
}

# Browser File Picker
windowrule {
  name = windowrule-23
  float = on
  size = 700 400
  match:class = (google-chrome)
  match:title = (Open Files)
}

# Generic
windowrule {
  name = windowrule-24
  float = on
  center = on
  match:title = ^(File Operation Progress)$
}

windowrule {
  name = windowrule-25
  float = on
  center = on
  match:title = ^(Properties)$
}

windowrule {
  name = windowrule-26
  float = on
  center = on
  match:title = ^(Confirm Replace)$
}

windowrule {
  name = windowrule-27
  float = on
  center = on
  match:title = ^(Rename)$
}

windowrule {
  name = windowrule-28
  float = on
  match:initial_class = thunar
  match:title = Rename: .*
}

# Blueman
# Float the window
windowrule {
  name = windowrule-29
  float = on
  size = 333 604
  move = (1165) (28)
  match:class = ^(blueman-manager)$
}

